services:
  db:
    image: postgres:15-alpine
    container_name: aqi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqi_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aqi_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqi_user} -d ${POSTGRES_DB:-aqi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqi_backend
    env_file:
      - .env
    # To use a GCP key file instead of BIGQUERY_CREDENTIALS_JSON, mount it here:
    volumes:
    - ./credentials/bq-key.json:/app/credentials/bq-key.json:ro
    # and set GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/bq-key.json in .env
    ports:
      - "8000:8000"
    networks:
      - db_net
      - web_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aqi_frontend
    ports:
      - "80:80"
    networks:
      - web_net
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aqi_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    networks:
      - web_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: aqi_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aqi.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - web_net
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

networks:
  db_net:
    driver: bridge
  web_net:
    driver: bridge

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

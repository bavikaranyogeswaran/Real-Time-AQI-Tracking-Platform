[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",   # FastAPI Depends() uses function calls as defaults — intentional
    "SIM108", # ternary collapse — sometimes less readable
    "E501",   # line too long — ruff format handles wrappable code; long strings are left as-is
]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["alembic/"]

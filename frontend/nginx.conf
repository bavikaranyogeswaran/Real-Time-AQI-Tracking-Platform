server {
    listen 80;
    root  /usr/share/nginx/html;

    # Hide nginx version from Server header and error pages
    server_tokens off;

    # ── Request limits ────────────────────────────────────────────────────
    client_max_body_size  1m;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     65s;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 4;
    gzip_vary       on;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;
    gzip_min_length 1024;

    # ── Backend API proxy ─────────────────────────────────────────────────
    # ^~ prevents regex locations below from matching /api/* paths
    location ^~ /api/ {
        proxy_pass             http://backend:8000;
        proxy_http_version     1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Append client IP to X-Forwarded-For chain — used by rate limiter
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove Connection header so upstream gets clean HTTP/1.1
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Hashed static assets (JS/CSS bundles from Vite) ──────────────────
    # Vite adds content hashes to filenames so these can be cached forever
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React SPA fallback ────────────────────────────────────────────────
    location / {
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
